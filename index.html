<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>読了帳 - 人間革命</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7a3b34" />

<!-- iOS ホーム画面対応 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="読了帳" />

<style>
  :root{
    --ink:#7a3b34;
    --ink-dark:#4a2622;
    --paper:#f7f2e7;
    --paper-deep:#efe6d3;
    --line:#d8cbb0;
    --muted:#8c7d64;
    --paper-card:#fffdf8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--paper);
    color:var(--ink-dark);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    overscroll-behavior:none;
  }
  #app{ max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:48px; }

  header{
    border-bottom:2px solid var(--ink);
    background:var(--paper-deep);
    padding:calc(env(safe-area-inset-top) + 20px) 20px 16px;
  }
  header .row{ display:flex; align-items:baseline; justify-content:space-between; }
  header h1{ color:var(--ink); letter-spacing:.08em; font-size:1.25rem; margin:0; font-weight:700; }
  header .status{ color:var(--muted); font-size:.72rem; }
  header p{ color:var(--muted); font-size:.75rem; margin:.4rem 0 0; }

  nav.tabs{ display:flex; gap:2px; padding:12px 10px 0; overflow-x:auto; }
  nav.tabs button{
    background:none; border:none; font-family:inherit;
    color:var(--muted); font-size:.9rem; padding:8px 12px;
    border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer;
  }
  nav.tabs button.active{ color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .tabs-divider{ border-bottom:1px solid var(--line); }

  main{ padding:16px; }

  .progress-wrap{ margin-bottom:16px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-bottom:4px; }
  .progress-track{ background:var(--line); height:6px; border-radius:3px; overflow:hidden; }
  .progress-fill{ background:var(--ink); height:6px; transition:width .3s ease; }

  .vol-card{ border:1px solid var(--line); background:var(--paper-card); border-radius:6px; margin-bottom:10px; }
  .vol-head{
    width:100%; background:none; border:none; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; cursor:pointer; color:var(--ink); font-size:.92rem; font-weight:700;
  }
  .vol-head .left{ display:flex; align-items:center; gap:8px; }
  .vol-head .count{ color:var(--muted); font-size:.75rem; font-weight:400; }
  .vol-body{ padding:0 12px 10px; display:none; }
  .vol-body.open{ display:block; }

  .chapter-row{
    display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px dashed var(--line);
  }
  .chapter-row:last-child{ border-bottom:none; }
  .chk{
    width:20px; height:20px; border:1.5px solid var(--ink); border-radius:3px;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:transparent; cursor:pointer;
  }
  .chk.done{ background:var(--ink); }
  .chk svg{ display:none; }
  .chk.done svg{ display:block; }
  .chapter-title{ flex:1; font-size:.9rem; }
  .chapter-title.done{ color:var(--muted); }
  .chapter-date{ font-size:.7rem; color:var(--muted); }

  .add-vol-btn{
    width:100%; background:none; border:1px dashed var(--ink); color:var(--ink);
    font-family:inherit; font-size:.85rem; padding:10px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-vol-form{ border:1px dashed var(--ink); border-radius:6px; padding:12px; }
  .add-vol-form .row{ display:flex; gap:8px; margin-bottom:8px; }
  .add-vol-form input{
    border:1px solid var(--line); background:var(--paper-card); border-radius:4px;
    padding:6px 8px; font-size:.85rem; font-family:inherit;
  }
  .add-vol-form input.num{ width:70px; }
  .add-vol-form input.chs{ flex:1; }
  .add-vol-form .actions{ display:flex; justify-content:flex-end; gap:8px; }
  .btn-ghost{ background:none; border:none; color:var(--muted); font-size:.8rem; font-family:inherit; cursor:pointer; }
  .btn-ink{ background:var(--ink); color:var(--paper); border:none; border-radius:4px; padding:6px 14px; font-size:.8rem; font-family:inherit; cursor:pointer; }

  .journal-form{ border:1px solid var(--line); background:var(--paper-card); border-radius:6px; padding:12px; margin-bottom:18px; }
  .journal-form .row{ display:flex; gap:8px; margin-bottom:8px; }
  .journal-form input[type=date]{ border:1px solid var(--line); border-radius:4px; padding:6px 8px; font-size:.85rem; font-family:inherit; background:var(--paper-card); }
  .journal-form select{ flex:1; border:1px solid var(--line); border-radius:4px; padding:6px 8px; font-size:.85rem; font-family:inherit; background:var(--paper-card); }
  .journal-form textarea{
    width:100%; border:1px solid var(--line); border-radius:4px; padding:8px;
    font-size:.9rem; font-family:inherit; resize:none; background:var(--paper-card);
  }
  .journal-form .submit-row{ display:flex; justify-content:flex-end; margin-top:8px; }
  .journal-form button.submit{
    background:var(--ink); color:var(--paper); border:none; border-radius:4px;
    padding:8px 16px; font-size:.85rem; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }

  .journal-entry{ border-left:3px solid var(--ink); background:var(--paper-card); padding:8px 10px; border-radius:2px; margin-bottom:10px; }
  .journal-entry .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .journal-entry .date{ font-size:.75rem; font-weight:700; color:var(--ink); }
  .journal-entry .del{ background:none; border:none; cursor:pointer; color:var(--muted); }
  .journal-entry .ref{ font-size:.72rem; color:var(--muted); margin-bottom:4px; }
  .journal-entry .text{ font-size:.9rem; white-space:pre-wrap; margin:0; color:var(--ink-dark); }
  .journal-empty{ text-align:center; padding:40px 0; color:var(--muted); font-size:.9rem; }

  .install-banner{
    position:fixed; left:0; right:0; bottom:0; background:var(--ink); color:var(--paper);
    padding:10px 16px; font-size:.8rem; display:flex; justify-content:space-between; align-items:center;
    gap:10px; z-index:50;
  }
  .install-banner button{ background:var(--paper); color:var(--ink); border:none; border-radius:4px; padding:6px 12px; font-size:.78rem; font-family:inherit; cursor:pointer; flex-shrink:0; }
  .install-banner .close{ background:none; color:var(--paper); font-size:1rem; padding:0 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- 初期データ(画像の読了表より) ---------------- */
const INITIAL_DATA = {
  "人間革命": [
    { vol:1, chapters:["はじめに","黎明","再建","終戦前後","占領","一人立つ","千里の道","胎動","歯車"] },
    { vol:2, chapters:["幾山河","序曲","光と影","前哨戦","地涌","車軸"] },
    { vol:3, chapters:["新生","渦中","群像","漣","結実","宣告","道程"] },
    { vol:4, chapters:["生命の庭","時流","波紋","疾風","怒濤","秋霜"] },
    { vol:5, chapters:["烈日","随喜","戦争と講和","前三後一","驀進","布石"] },
    { vol:6, chapters:["七百年祭","推移","余燼","離陸"] },
    { vol:7, chapters:["飛翔","原点","翼の下","水滸の誓","匆匆の間"] },
    { vol:8, chapters:["真実","推進","学徒","明暗","多事"] },
    { vol:9, chapters:["発端","小樽問答","展開","上げ潮","実証"] },
    { vol:10, chapters:["一念","脈動","跳躍","険路","展望"] },
    { vol:11, chapters:["転機","波瀾","夕張","大阪","裁判"] },
    { vol:12, chapters:["涼風","宣言","憂愁","後継","寂光","新・黎明","あとがき"] },
  ],
  "新・人間革命": [
    { vol:1, chapters:["はじめに","旭日","新世界","錦秋","慈光","開拓者","あとがき"] },
    { vol:2, chapters:["先駆","錬磨","勇舞","民衆の旗"] },
    { vol:3, chapters:["仏法西還","月氏","仏陀","平和の光"] },
    { vol:4, chapters:["春嵐","凱旋","青葉","立正安国","大光"] },
    { vol:5, chapters:["開道","歓喜","勝利","獅子"] },
    { vol:6, chapters:["宝土","遠路","加速","波浪","若鷲"] },
    { vol:7, chapters:["文化の華","萌芽","早春","操舵"] },
    { vol:8, chapters:["布陣","宝剣","清流","激流"] },
    { vol:9, chapters:["新時代","鳳雛","光彩","衆望"] },
    { vol:10, chapters:["言論城","幸風","新航路","桂冠"] },
  ],
};
const BOOKS = Object.keys(INITIAL_DATA);
const STORAGE_KEY = "ningen-kakumei-tracker-pwa-v1";

/* ---------------- 状態管理(localStorage) ---------------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error(e); }
  return { completion:{}, journal:[], customChapters:{}, openVols:{} };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("保存失敗", e); }
}
let state = loadState();
let tab = BOOKS[0];

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function chapterKey(book, vol, idx){ return `${book}::${vol}::${idx}`; }

function dataOf(book){
  const base = INITIAL_DATA[book];
  const custom = state.customChapters[book] || [];
  return [...base, ...custom].sort((a,b)=>a.vol-b.vol);
}
function progressOfVol(book, vol, chapters){
  let done=0;
  chapters.forEach((_,idx)=>{ if(state.completion[chapterKey(book,vol,idx)]?.done) done++; });
  return { done, total:chapters.length };
}
function progressOfBook(book){
  let done=0, total=0;
  dataOf(book).forEach(v=>{
    v.chapters.forEach((_,idx)=>{
      total++;
      if(state.completion[chapterKey(book,v.vol,idx)]?.done) done++;
    });
  });
  return { done, total };
}

const CHECK_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f7f2e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const CHEVRON_DOWN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a3b34" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
const CHEVRON_RIGHT = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a3b34" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
const TRASH_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c7d64" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>`;

let addingVolFor = null;
let journalDraft = { date: todayStr(), text: "", ref: "" };

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- 描画 ---------------- */
function render(){
  const app = document.getElementById("app");
  const allTabs = [...BOOKS, "日々の感想"];

  let html = `
  <header>
    <div class="row">
      <h1>読了帳</h1>
      <span class="status">端末に自動保存</span>
    </div>
    <p>人間革命・新人間革命の読了記録と、日々の感想を残す帳面</p>
  </header>
  <nav class="tabs">
    ${allTabs.map(t => `<button data-tab="${esc(t)}" class="${t===tab?'active':''}">${esc(t)}</button>`).join("")}
  </nav>
  <div class="tabs-divider"></div>
  <main>`;

  if(tab !== "日々の感想"){
    const { done, total } = progressOfBook(tab);
    const pct = total ? Math.round(done/total*100) : 0;
    html += `
    <div class="progress-wrap">
      <div class="progress-label"><span>読了 ${done} / ${total} 章</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

    dataOf(tab).forEach(v => {
      const { done, total } = progressOfVol(tab, v.vol, v.chapters);
      const volKey = `${tab}::${v.vol}`;
      const opened = !!state.openVols[volKey];
      html += `
      <div class="vol-card">
        <button class="vol-head" data-volkey="${esc(volKey)}">
          <span class="left">${opened?CHEVRON_DOWN:CHEVRON_RIGHT}第${v.vol}巻</span>
          <span class="count">${done}/${total}</span>
        </button>
        <div class="vol-body ${opened?'open':''}">
          ${v.chapters.map((c, idx) => {
            const key = chapterKey(tab, v.vol, idx);
            const isDone = !!state.completion[key]?.done;
            const dateStr = state.completion[key]?.date || "";
            return `
            <div class="chapter-row">
              <button class="chk ${isDone?'done':''}" data-chapterkey="${esc(key)}">${CHECK_SVG}</button>
              <span class="chapter-title ${isDone?'done':''}">${esc(c)}</span>
              ${isDone && dateStr ? `<span class="chapter-date">${esc(dateStr)}</span>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    });

    if(addingVolFor === tab){
      html += `
      <div class="add-vol-form">
        <div class="row">
          <input class="num" type="number" id="newVolNum" placeholder="巻番号" />
          <input class="chs" type="text" id="newVolChapters" placeholder="章名(読点区切り:例 旭日、新世界、錦秋)" />
        </div>
        <div class="actions">
          <button class="btn-ghost" id="cancelAddVol">キャンセル</button>
          <button class="btn-ink" id="confirmAddVol">追加する</button>
        </div>
      </div>`;
    } else {
      html += `<button class="add-vol-btn" id="openAddVol">＋ 巻を追加する</button>`;
    }
  } else {
    // 日々の感想
    const options = [];
    BOOKS.forEach(book => {
      dataOf(book).forEach(v => {
        v.chapters.forEach(c => options.push(`${book} 第${v.vol}巻「${c}」`));
      });
    });

    html += `
    <div class="journal-form">
      <div class="row">
        <input type="date" id="journalDate" value="${esc(journalDraft.date)}" />
        <select id="journalRef">
          <option value="">(章を紐づけない)</option>
          ${options.map(o => `<option value="${esc(o)}" ${journalDraft.ref===o?'selected':''}>${esc(o)}</option>`).join("")}
        </select>
      </div>
      <textarea id="journalText" rows="4" placeholder="今日読んで感じたこと、心に残った一節など">${esc(journalDraft.text)}</textarea>
      <div class="submit-row">
        <button class="submit" id="addJournal">記す</button>
      </div>
    </div>`;

    if(state.journal.length === 0){
      html += `<p class="journal-empty">まだ感想がありません。読んだ日の思いを書き留めてみましょう。</p>`;
    } else {
      state.journal.forEach(e => {
        html += `
        <div class="journal-entry">
          <div class="top">
            <span class="date">${esc(e.date)}</span>
            <button class="del" data-delid="${esc(e.id)}">${TRASH_SVG}</button>
          </div>
          ${e.ref ? `<div class="ref">${esc(e.ref)}</div>` : ""}
          <p class="text">${esc(e.text)}</p>
        </div>`;
      });
    }
  }

  html += `</main>`;
  app.innerHTML = html;
  bindEvents();
}

/* ---------------- イベント ---------------- */
function bindEvents(){
  document.querySelectorAll("nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ tab = btn.dataset.tab; addingVolFor=null; render(); });
  });

  document.querySelectorAll(".vol-head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.volkey;
      state.openVols[k] = !state.openVols[k];
      render();
    });
  });

  document.querySelectorAll(".chk").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.chapterkey;
      if(state.completion[key]?.done){ delete state.completion[key]; }
      else { state.completion[key] = { done:true, date: todayStr() }; }
      saveState();
      render();
    });
  });

  const openAddVol = document.getElementById("openAddVol");
  if(openAddVol) openAddVol.addEventListener("click", ()=>{ addingVolFor = tab; render(); });

  const cancelAddVol = document.getElementById("cancelAddVol");
  if(cancelAddVol) cancelAddVol.addEventListener("click", ()=>{ addingVolFor = null; render(); });

  const confirmAddVol = document.getElementById("confirmAddVol");
  if(confirmAddVol) confirmAddVol.addEventListener("click", ()=>{
    const num = parseInt(document.getElementById("newVolNum").value, 10);
    const chaptersRaw = document.getElementById("newVolChapters").value;
    const chapters = chaptersRaw.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean);
    if(!num || chapters.length===0) return;
    if(!state.customChapters[tab]) state.customChapters[tab] = [];
    state.customChapters[tab].push({ vol:num, chapters });
    saveState();
    addingVolFor = null;
    render();
  });

  const journalDate = document.getElementById("journalDate");
  if(journalDate) journalDate.addEventListener("change", e=>{ journalDraft.date = e.target.value; });

  const journalRef = document.getElementById("journalRef");
  if(journalRef) journalRef.addEventListener("change", e=>{ journalDraft.ref = e.target.value; });

  const journalText = document.getElementById("journalText");
  if(journalText) journalText.addEventListener("input", e=>{ journalDraft.text = e.target.value; });

  const addJournal = document.getElementById("addJournal");
  if(addJournal) addJournal.addEventListener("click", ()=>{
    if(!journalDraft.text.trim()) return;
    const entry = {
      id: `${Date.now()}`,
      date: journalDraft.date || todayStr(),
      text: journalDraft.text.trim(),
      ref: journalDraft.ref || null,
    };
    state.journal.unshift(entry);
    saveState();
    journalDraft = { date: todayStr(), text:"", ref:"" };
    render();
  });

  document.querySelectorAll("[data-delid]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.delid;
      state.journal = state.journal.filter(e=>e.id!==id);
      saveState();
      render();
    });
  });
}

render();

/* ---------------- Service Worker 登録(オフライン対応) ---------------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ---------------- ホーム画面追加バナー(Android/Chrome) ---------------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});
function showInstallBanner(){
  if(document.getElementById("installBanner")) return;
  const banner = document.createElement("div");
  banner.className = "install-banner";
  banner.id = "installBanner";
  banner.innerHTML = `
    <span>ホーム画面に追加して、アプリのように使えます</span>
    <button id="installBtn">追加する</button>
    <button class="close" id="closeInstallBtn">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById("installBtn").addEventListener("click", async ()=>{
    banner.remove();
    if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
  });
  document.getElementById("closeInstallBtn").addEventListener("click", ()=> banner.remove());
}
</script>
</body>
</html>
